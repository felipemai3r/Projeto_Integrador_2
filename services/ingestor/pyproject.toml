[project]
name = "ingestor"
version = "0.1.0"
description = "Coleta, normalizacao, validacao e gravacao de leituras das fontes externas"
requires-python = ">=3.12"
dependencies = [
  "common",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
