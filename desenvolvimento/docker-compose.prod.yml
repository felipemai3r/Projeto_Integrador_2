# Producao: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Diferencas do desenvolvimento: front estatico em Nginx, API e banco sem porta publica,
# backup diario, reinicio automatico. HTTPS: perfil "https" (Caddy) ou o proxy da UDESC.
services:
  db:
    ports: !reset []
    restart: always

  api:
    ports: !reset []
    restart: always
    environment:
      AVALIADOR_ATIVO: "true"
      CORS_ORIGENS: ${URL_PUBLICA:?defina URL_PUBLICA no .env}
      URL_PUBLICA: ${URL_PUBLICA}

  ingestor:
    restart: always

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [api]
    ports: ["${PORTA_WEB:-8080}:80"]
    restart: always

  caddy:
    profiles: ["https"]
    build:
      context: .
      dockerfile: caddy/Dockerfile
    environment:
      DOMINIO: ${DOMINIO:-}
    volumes:
      - caddy_dados:/data
    ports: ["80:80", "443:443"]
    depends_on: [web]
    restart: always

  # Backup diario do banco (a base coletada nao e reconstituivel). Mantem 14 dias no volume.
  # Copie para FORA do servidor: veja scripts/backup.sh e a secao de backup do README.
  backup:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - backups:/backups
    depends_on:
      db: { condition: service_healthy }
    restart: always

volumes:
  caddy_dados:
  backups:
