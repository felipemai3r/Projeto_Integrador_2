[project]
name = "modelo"
version = "0.1.0"
description = "Analise de correlacao defasada, variaveis, treino e validacao"
requires-python = ">=3.12"
dependencies = [
  "common",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
