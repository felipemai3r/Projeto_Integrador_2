[project]
name = "api"
version = "0.1.0"
description = "API publica: estacoes, leituras, risco, chuva"
requires-python = ">=3.12"
dependencies = [
  "common",
  "modelo",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "apscheduler>=3.10,<4",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
