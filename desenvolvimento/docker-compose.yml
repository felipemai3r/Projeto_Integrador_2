name: projetointegradorii

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }

  ingestor:
    build:
      context: ./backend
      dockerfile: services/ingestor/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # API do painel da Defesa Civil municipal; sem a chave, esse coletor nao e agendado
      PDC_API_URL: ${PDC_API_URL:-https://uizatcahxcyscjbkxnzp.supabase.co/functions/v1/stations-api}
      PDC_API_KEY: ${PDC_API_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
      AVALIADOR_ATIVO: "true"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
      PASTA_FOTOS: /dados/fotos
      PASTA_ARTEFATOS: /artefatos
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:equipe@exemplo.br}
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:5173}
      # avisos por e-mail: em desenvolvimento vao para o Mailpit (http://localhost:8025)
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORTA: ${SMTP_PORTA:-1025}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-Rios de Presidente Getúlio <avisos@exemplo.br>}
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - fotos:/dados/fotos
      - artefatos:/artefatos:ro
    ports: ["8000:8000"]
    restart: unless-stopped

  # Caixa de e-mail local para desenvolvimento: tudo que a API envia aparece em localhost:8025.
  # Em producao, SMTP_HOST aponta para um servidor real e este servico nao e usado.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped

  # Retreino diario dos modelos de previsao (publica sozinho quando a RN07 for atendida)
  treinador:
    build:
      context: ./backend
      dockerfile: services/modelo/Dockerfile
    command: ["python", "-m", "modelo.agendador"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PASTA_ARTEFATOS: /artefatos
    volumes:
      - artefatos:/artefatos
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # Jobs de analise, sob demanda: docker compose run --rm modelo python -m modelo.correlacao
  modelo:
    profiles: ["jobs"]
    build:
      context: ./backend
      dockerfile: services/modelo/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PASTA_ARTEFATOS: /artefatos
    volumes:
      - artefatos:/artefatos
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  fotos:
  artefatos:
