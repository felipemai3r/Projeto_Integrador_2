name: projetointegradorii

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }

  ingestor:
    build:
      context: ./backend
      dockerfile: services/ingestor/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
      AVALIADOR_ATIVO: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["8000:8000"]
    restart: unless-stopped

  # Jobs de analise, sob demanda: docker compose run --rm modelo python -m modelo.correlacao
  modelo:
    profiles: ["jobs"]
    build:
      context: ./backend
      dockerfile: services/modelo/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
