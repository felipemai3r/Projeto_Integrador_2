# Servidor do portal: estaticos do PWA e proxy da API.
# HTTPS e terminado na frente (Caddy ou o proxy da UDESC); aqui chega HTTP simples.

upstream api { server api:8000; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;   # foto de ocorrencia (limite de 5 MB na API)

    # Cabecalhos de seguranca (RNF09, RNF10)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # API: dado ao vivo nunca e cacheado pelo navegador nem por intermediarios
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # O service worker e o manifesto precisam revalidar sempre, para atualizar o app
    location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rotas do app (SPA)
    location / { try_files $uri /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
