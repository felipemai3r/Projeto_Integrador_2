# Servidor do portal: estaticos do PWA e proxy da API.
# HTTPS e terminado na frente (Caddy ou o proxy da UDESC); aqui chega HTTP simples.

upstream api { server api:8000; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;   # foto de ocorrencia (limite de 5 MB na API)

    # API: dado ao vivo nunca e cacheado pelo navegador nem por intermediarios
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-store" always;
    }

    # O service worker e o manifesto precisam revalidar sempre, para atualizar o app
    location = /sw.js {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Rotas do app (SPA) e demais arquivos (icones)
    location / {
        include /etc/nginx/seguranca.conf;
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
