name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pgetulio
          POSTGRES_USER: pgetulio
          POSTGRES_PASSWORD: troque_esta_senha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pgetulio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -e "desenvolvimento/backend/services/common[dev]" -e "desenvolvimento/backend/services/ingestor[dev]" -e "desenvolvimento/backend/services/api[dev]" -e "desenvolvimento/backend/services/modelo[dev]"
      - name: Lint
        run: ruff check desenvolvimento/backend && ruff format --check desenvolvimento/backend
      - name: Testes
        run: pytest desenvolvimento/backend/services -q
      - name: Contraste do design
        run: python3 .claude/skills/farol-system/scripts/verificar-contraste.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desenvolvimento/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desenvolvimento/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp desenvolvimento/.env.example desenvolvimento/.env
      # o compose exige JWT_SECRET; no CI so se constroi as imagens, entao vale um valor descartavel
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> desenvolvimento/.env
      - run: docker compose -f desenvolvimento/docker-compose.yml build
